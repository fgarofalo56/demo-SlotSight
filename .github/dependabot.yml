version: 2

updates:
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      python-minor:
        update-types: ['minor', 'patch']

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      js-minor:
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(docker)'
