name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Do not paste credentials.** If you already have somewhere,
        rotate it first. See SECURITY.md.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. make up
        2. curl ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: |
        Redact anything credential-shaped. Useful commands:
        `docker compose logs api --tail 50`
        `curl -fsS localhost:8000/api/health`
      render: shell

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Analytics / recommendations
        - Chat / Azure OpenAI
        - Frontend
        - Docker / local setup
        - Copilot configuration (agents, hooks, MCP)
        - Azure deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: 'Windows 11, Docker 29, Python 3.12'
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked docs/troubleshooting.md
          required: true
        - label: There is no credential in anything I pasted above
          required: true
