name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: apps/api
        run: uv venv && uv pip install -e ".[dev]"

      - name: Lint
        working-directory: apps/api
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        working-directory: apps/api
        run: uv run mypy src

      - name: Tests
        working-directory: apps/api
        run: uv run pytest -q

      # Called out separately so a failure here is unmistakable in the log.
      # These assert the pipeline reaches the right CONCLUSIONS about a floor
      # whose truth we control - see apps/api/tests/test_scenarios.py.
      - name: Golden tests (planted narrative signals)
        working-directory: apps/api
        run: uv run pytest -m golden -v

  web:
    name: Web — types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --no-frozen-lockfile

      - name: Type check
        working-directory: apps/web
        run: pnpm exec tsc --noEmit

      - name: Tests
        working-directory: apps/web
        run: pnpm exec vitest run

      - name: Build
        working-directory: apps/web
        run: pnpm exec vite build

  stack:
    name: Docker stack — end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The unit tests run against SQLite, which returns plain ints from SUM().
      # Postgres returns Decimal. This job is the only thing in CI that would
      # catch a regression in the coercion at the SQL boundary.
      - name: Build and start
        run: docker compose up --build -d

      - name: Wait for the API to become healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/health >/dev/null 2>&1; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API never became healthy"; docker compose logs; exit 1

      - name: Verify the floor is seeded and analytics work
        run: |
          set -euo pipefail
          curl -fsS localhost:8000/api/health | tee /dev/stderr | grep -q '"status": *"ok"'
          curl -fsS "localhost:8000/api/floor/summary?days=30" | python3 -c "
          import json,sys
          d = json.load(sys.stdin)
          assert d['active_machine_count'] > 800, d['active_machine_count']
          assert d['floor_wpupd'] > 0
          assert len(d['zones']) == 6
          print(f\"OK: {d['active_machine_count']} machines, WPUPD \${d['floor_wpupd']}\")
          "
          curl -fsS "localhost:8000/api/recommendations?days=30&limit=5" | python3 -c "
          import json,sys
          d = json.load(sys.stdin)
          assert d['total'] > 0
          assert all(r['evidence'] for r in d['recommendations']), 'a recommendation had no evidence'
          print(f\"OK: {d['total']} recommendations, all evidenced\")
          "

      - name: Chat must fail cleanly when Azure OpenAI is absent
        run: |
          code=$(curl -s -o /tmp/body.json -w '%{http_code}' -X POST localhost:8000/api/chat \
            -H 'content-type: application/json' -d '{"message":"hello"}')
          test "$code" = "503" || (echo "expected 503, got $code"; cat /tmp/body.json; exit 1)
          grep -q 'azure_openai_not_configured' /tmp/body.json
          echo "OK: 503 with actionable remediation"

      - name: Web serves the SPA and proxies the API
        run: |
          curl -fsS localhost:5173/ | grep -q 'SlotSight'
          curl -fsS "localhost:5173/api/floor/summary?days=7" >/dev/null
          echo "OK: SPA served, /api proxied"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 100

      - name: Tear down
        if: always()
        run: docker compose down -v
