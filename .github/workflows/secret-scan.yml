name: Secret scan

# The real backstop. Layers 1-3 (.gitignore, local git hooks, the Copilot
# guardrail) all run on a developer's machine and are all defeated by
# `--no-verify`. This runs server-side over FULL history, where nothing local
# can reach it. See SECURITY.md.

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # Weekly, because a credential can be introduced by a dependency update or
    # a merge that never triggered a push event on this branch.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks — full history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # fetch-depth: 0 is load-bearing. The default shallow clone would scan
          # only the tip commit, and a secret committed then removed would pass
          # silently - which is exactly the case that matters, because a push
          # already published it.
          fetch-depth: 0

      - name: Scan full history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'true'

  repo-guard:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No credential-shaped files are tracked
        run: |
          set -euo pipefail
          # NOTE: `grep -E` is POSIX ERE and has NO negative lookahead. An
          # earlier version of this used `(?!example)`, which does not fail
          # loudly — it silently breaks the whole alternative, so `.env` and
          # `.env.local` were never matched and this guard caught nothing.
          # Exclude the template with a second pass instead.
          bad=$(git ls-files \
                | grep -Ei '(^|/)\.env($|\.)|(^|/)secrets?/|\.(pem|key|pfx|p12|jks)$|(^|/)id_(rsa|dsa|ecdsa|ed25519)$' \
                | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::credential-shaped files are tracked:"
            echo "$bad"
            exit 1
          fi
          echo "OK: no credential-shaped files tracked"

      - name: .env.example contains placeholders only
        run: |
          set -euo pipefail
          # Key on the ABSENCE of a placeholder marker, not on the presence of a
          # domain. The first version of this check matched
          # `cognitiveservices.azure.com` anywhere in the value — which the
          # legitimate placeholder
          # `https://<your-resource-name>.cognitiveservices.azure.com/` contains,
          # so it failed on a clean file. A guard that cries wolf gets deleted.
          #
          # A real value has a concrete host and no angle brackets; a placeholder
          # always has <...>, ${...}, or an obvious token.
          bad=$(grep -nE '^[A-Z_]+=(https?://)?[^<>${}]*\.(cognitiveservices\.azure\.com|openai\.azure\.com|postgres\.database\.azure\.com)' .env.example || true)
          if [ -n "$bad" ]; then
            echo "::error::.env.example appears to contain a real endpoint, not a placeholder"
            echo "$bad"
            exit 1
          fi
          echo "OK: .env.example holds placeholders"

      - name: The agent guardrail is wired up
        run: |
          set -euo pipefail
          test -f .github/hooks/guardrails.json
          test -f .github/hooks/scripts/guard_secrets.py
          python3 -c "
          import json
          h = json.load(open('.github/hooks/guardrails.json'))['hooks']
          assert 'PreToolUse' in h, 'PreToolUse hook is missing'
          print('OK: PreToolUse guardrail registered')
          "

      - name: No player/PII table has crept into the schema
        run: |
          set -euo pipefail
          if grep -Ein '__tablename__ *= *.(players?|patrons?|customers?|members?|loyalty)' \
               apps/api/src/slotsight/models/*.py; then
            echo "::error::a player/PII table was added - see Constitution VII"
            exit 1
          fi
          echo "OK: no player table"
