# nginx config for the SlotSight SPA.
#
# Port 8080 rather than 80 so the container can run as a non-root user —
# binding below 1024 requires privileges we do not want to grant.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Hashed assets are immutable; index.html must never be cached or a deploy
    # leaves users on a stale bundle pointing at assets that no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Proxy the API so the browser sees one origin and never needs CORS.
    # API_HOST is substituted at container start; defaults to the compose
    # service name.
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # The chat endpoint calls Azure OpenAI and can legitimately take a
        # while when the model chains several tool calls.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SPA fallback: any unknown path renders the app, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;
}
